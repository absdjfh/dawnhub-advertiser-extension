<!-- Dawnhub's own top banner, carrying its dark mode toggle. -->
<header class="MuiAppBar-root">
  <div class="MuiToolbar-root">
    <button aria-label="toggle dark mode" type="button"><svg data-testid="DarkModeIcon"></svg></button>
  </div>
</header>
<!-- Dawnhub's own raid filter, stacking its label above the armor types it filters VIP raids by. -->
<div class="MuiStack-root">

    <button value="cloth" aria-pressed="false">Cloth</button>

    <button value="mail" aria-pressed="false">Mail</button>
    <button value="plate" aria-pressed="false">Plate</button>
  </div>
</div>
